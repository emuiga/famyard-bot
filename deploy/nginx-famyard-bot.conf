# Replace famyard-bot.84-247-153-66.sslip.io with the final domain when Famyard's DNS is ready,
# then re-run certbot for the new name.
server {
    listen 80;
    listen [::]:80;
    server_name famyard-bot.84-247-153-66.sslip.io;

    # Only the webhook and health check are public
    location = /webhook {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        return 404;
    }
}
